name: examples

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s examples -p 'test_*.py'
      - run: python3 examples/receipt_eval.py examples/sample_predictions.jsonl
      - run: python3 -m unittest discover -s spaces/receipt-eval -p 'test_*.py'
